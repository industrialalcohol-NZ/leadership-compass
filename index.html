<style>

*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.4;cursor:not-allowed}a{color:var(--teal)}:focus-visible{outline:3px solid #58aaa4;outline-offset:2px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,7vw,44px);letter-spacing:-1.65px;line-height:1.1;margin-bottom:12px;font-weight:750}h2{font-size:22px;letter-spacing:-.6px;line-height:1.2}h3{font-size:17px;letter-spacing:-.25px}small{font-size:12px}.app{max-width:840px;min-height:100dvh;margin:auto;background:var(--bg)}.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 20px 14px;background:var(--bg)}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:-.6px}.brand-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--ink);color:white;font-weight:800;font-size:19px}.top-note{color:var(--muted);font-size:12px;text-align:right}.main{padding:6px 20px calc(var(--nav) + 56px + env(safe-area-inset-bottom))}.eyebrow{font-weight:800;color:var(--teal);letter-spacing:1.4px;text-transform:uppercase;font-size:10px;margin-bottom:12px}.lead{color:var(--muted);font-size:15px;max-width:500px}.hero{padding:22px 0 19px}.context-switch{display:flex;gap:5px;background:#edf1ed;border-radius:14px;padding:4px;margin-bottom:22px}.context-switch button{border:0;background:transparent;color:#627574;padding:9px 8px;border-radius:11px;flex:1;font-weight:650;font-size:12px;white-space:nowrap}.context-switch button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 8px #183e3620}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 13px}.section-head h2{marg av span{font-size:10px;font-weight:750}.progress{height:8px;background:#e5ece8;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#2a8d79;border-radius:20px;transition:width .25s}.progress.white{background:#325057}.progress.white>div{background:#c6e9a5}.bars{height:100px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:20px 0 7px}.bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;gap:7px}.bar{width:100%;max-width:33px;min-height:4px;border-radius:6px 6px 3px 3px;background:#b9d5cb}.bar.current{background:var(--teal)}.bar-label{font-size:10px;color:var(--muted)}.empty{border:1px dashed #cbdad2;border-radius:17px;padding:27px 20px;background:#fbfcfa;text-align:center;color:var(--muted);font-size:13px}.quote{font-size:18px;font-weight:650;line-height:1.5;letter-spacing:-.3px;color:var(--ink);border-left:3px solid #7ab6a3;padding:8px 0 8px 16px;margin:13px 0}.toast{position:fixed;z-index:40;left:50%;bottom:calc(var(--nav) + 27px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(15px);width:max-content;max-width:calc(100vw - 28px);background:#183c39;color:white;padding:10px 17px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 24px #0002;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.page-header{padding:12px 0 4px}.page-header h1{font-size:32px}.detail-text{white-space:pre-wrap;overflow-wrap:anywhere}.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:850;margin:16px 0 5px}.detail-value{line-height:1.65}.action-item{border-left:3px solid #b4d9cb;padding-left:12px}.action-item p{margin-bottom:8px}.week-questions li{margin-bottom:8px}.privacy{background:#f0f5f1;border:1px solid #dcebe2;border-radius:13px;padding:15px;font-size:12px;color:#44605b}.back{border:none;background:none;color:var(--teal);font-weight:750;padding:9px 0 14px}.tag-dot{width:8px;height:8px;border-radius:50%;background:#48a18e;display:inline-block}.goal-category{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:800}.goal-item{border-bottom:1px solid var(--line);padding:16px 0}.goal-item:last-child{border:none}.goal-item h3{margin-bottom:2px}.switch{position:relative;width:44px;height:26px;display:inline-block;flex-shrink:0}.switch input{position:absolute;opacity:0}.switch span{position:absolute;inset:0;border-radius:30px;background:#dce5df;transition:.2s}.switch span:after{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:white;box-shadow:0 1px 4px #0002;border-radius:50%;transition:.2s}.switch input:checked + span{background:var(--teal)}.switch input:checked + span:after{transform:translateX(18px)}.switch input:focus-visible+span{outline:3px solid #7ccab6}.hide{display:none!important}.faded{opacity:.75}.subhead{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.9px;font-weight:850;margin:20px 0 7px}.kbd{display:inline-block;background:#e5eae7;border-radius:5px;padding:1px 6px}.footer-note{font-size:11px;color:#84958f;text-align:center;margin:24px 0}.form-actions{display:flex;gap:9px}.form-actions .btn{flex:1}.form-actions .btn+.btn{margin:0}.tip{color:#4b6d61;background:#eff7ed;padding:11px 13px;border-radius:12px;font-size:12px}

<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="brand-icon" aria-hidden="true">↗</div> Leadwell</div><div class="top-note">LEADERSHIP<br>IN PRACTICE</div></header>
  <main id="app" class="main" tabindex="-1"></main>
  <nav class="nav" aria-label="Main navigation" id="navigation"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script>
'use strict';
const STORAGE_KEY='leadwell-v1';
const SKILLS=[
 {id:'listen',name:'Listen before solving',desc:'Ask two good questions before offering an answer.',tag:'Coaching'},
 {id:'clarity',name:'Make expectations explicit',desc:'Confirm the outcome, owner, constraints and deadline.',tag:'Communication'},
 {id:'delegate',name:'Delegate outcomes, not tasks',desc:'Give ownership and authority; agree on check-ins.',tag:'Empowerment'},
 {id:'feedback',name:'Give timely, specific feedback',desc:'Describe behaviour, its impact and one next step.',tag:'Coaching'},
 {id:'calm',name:'Stay composed under pressure',desc:'Pause, prioritise, communicate calmly and clearly.',tag:'Decision-making'},
 {id:'intent',name:'Communicate intent',desc:'State the objective, why it matters and operating boundaries.',tag:'Command & clarity'},
 {id:'debrief',name:'Debrief without blame',desc:'Ask what was expected, what occurred and what to learn.',tag:'Learning culture'},
 {id:'safety',name:'Create psychological safety',desc:'Invite dissent and thank people who raise concerns.',tag:'Team culture'},
 {id:'decision',name:'Make decisions with uncertainty',desc:'Surface assumptions, risks and triggers for review.',tag:'Judgement'},
 {id:'accountability',name:'Close the loop',desc:'Agree on follow-up and check that commitments happen.',tag:'Execution'},
 {id:'conflict',name:'Address tension early',desc:'Name the issue respectfully and focus on shared outcomes.',tag:'Relationships'},
 {id:'situational',name:'Build shared situational awareness',desc:"Check the team's understanding of changes and risks.",tag:'Operational leadership'}
];
const COMPETENCIES=['Communication','Coaching','Delegation','Decision-making','Calm under pressure','Command & clarity','Safety leadership','Accountability','Conflict resolution','Team culture','Situational awareness','Other'];
const ICONS={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',log:'<path d="M12 5v14M5 12h14"/><circle cx="12" cy="12" r="10"/>',focus:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',review:'<path d="M3 3v18h18M8 15l4-4 4 2 5-6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 1 1.8-2 3.4-2.1-.1a8 8 0 0 1-2.2 1.3l-1 1.8h-4l-.9-1.8a8 8 0 0 1-2.3-1.3l-2.1.1-2-3.4 1-1.8a8 8 0 0 1 0-2.6l-1-1.8 2-3.4 2.1.1a8 8 0 0 1 2.3-1.3L9.1 4h4l1 1.8a8 8 0 0 1 2.2 1.3l2.1-.1 2 3.4-1 1.8a8 8 0 0 1 0 2.8z" transform="translate(0 -1) scale(1 .95)"/>'};
const $=id=>document.getElementById(id);
const safe=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);
const pad=n=>String(n).padStart(2,'0');
const localDay=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayOffset=(days)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return localDay(d)};
const prettyDate=(day, opts={month:'short',day:'numeric'})=>{if(!day)return '';const d=new Date(day+'T12:00:00');return isNaN(+d)?'':d.toLocaleDateString(undefined,opts)};
const weekStart=()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return localDay(d)};
const weekDate=(d)=>{const date=new Date((d||localDay())+'T12:00:00');date.setDate(date.getDate()-((date.getDay()+6)%7));return localDay(date)};
function baseData(){return {version:1,entries:[],checkins:[],goals:SKILLS.map(g=>({...g,active:['listen','clarity'].includes(g.id),role:'both'})),practices:{},weekly:[],reminderTime:'20:30',context:'all'};}
function loadData(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY));if(data&&Array.isArray(data.entries)&&Array.isArray(data.goals)&&Array.isArray(data.checkins)){return {...baseData(),...data,practices:data.practices&&typeof data.practices==='object'?data.practices:{},weekly:Array.isArray(data.weekly)?data.weekly:[]}}}catch(e){console.warn('Local journal unavailable',e)}return baseData()}
let state=loadData();let view='today';let editing=null;let showingReviewEntry=null;let editCheckin=null;let toastTimer=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(e){notify('Could not save. Please export your data or free device storage.');return false}}
function notify(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function go(to,option){view=to;editing=to==='log'?option||null:null;showingReviewEntry=to==='detail'?option||null:null;editCheckin=to==='checkin'?option||null:null;render();window.scrollTo(0,0)}
function roleText(r){return r==='engineering'?'Engineering':r==='fire'?'Fire service':'Both roles'}
function rolePill(r){return `<span class="pill ${r==='fire'?'fire':r==='engineering'?'eng':''}">${safe(roleText(r))}</span>`}
function kindPill(k){return `<span class="pill ${k==='win'?'win':k==='lesson'?'learn':'both'}">${k==='win'?'Win':k==='lesson'?'Learning':'Win + learning'}</span>`}
function matchesRole(entry){return state.context==='all'||entry.role===state.context||entry.role==='both'}
function entries(){return state.entries.filter(matchesRole).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)))}
function checkins(){return state.checkins.filter(matchesRole).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function activeGoals(){return state.goals.filter(g=>g.active&&(state.context==='all'||g.role===state.context||g.role==='both'))}
function performed(date,goalId){return !!(state.practices[date]||{})[goalId]}
function todayCheckin(){return checkins().find(c=>c.date===localDay())}
function icon(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`}
function nav(){const tabs=[['today','Today','home'],['log','Capture','log'],['focus','Practise','focus'],['review','Review','review'],['settings','Settings','settings']];const current=['detail','complete','weekly'].includes(view)?'review':view==='checkin'?'today':view;return tabs.map(([id,label,ic])=>`<button data-nav="${id}" class="${current===id?'active':''}" aria-label="${label}" ${current===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}
function filterBar(){return `<div class="context-switch" role="group" aria-label="Show context">${[['all','All'],['engineering','Engineering'],['fire','Fire service']].map(([val,lab])=>`<button data-context="${val}" aria-pressed="${state.context===val}">${lab}</button>`).join('')}</div>`}
function momentCard(e){const excerpt=e.learning||e.outcome||e.situation||'';return `<div class="moment"><button class="textlink" data-entry="${safe(e.id)}"><div class="row between"><div class="grow"><div class="chip-line">${kindPill(e.kind)} ${rolePill(e.role)} <span class="date-label" style="align-self:center">${prettyDate(e.date)}</span></div><div class="moment-title">${safe(e.title)}</div><div class="moment-copy">${safe(excerpt)}</div></div><div class="circle-arrow" aria-hidden="true">›</div></div></button></div>`}
function goalCheck(g,date){const done=performed(date,g.id);return `<label class="check-row ${done?'done':''}"><input class="check" type="checkbox" data-practice="${safe(g.id)}" ${done?'checked':''}><span class="grow"><span class="title">${safe(g.name)}</span><span class="detail">${safe(g.desc)}</span></span></label>`}
function todayView(){const today=localDay(),c=todayCheckin(),goals=activeGoals(),completed=goals.filter(g=>performed(today,g.id)).length,ee=entries(),pending=ee.filter(e=>e.next&&e.status!=='tried'),time=(state.reminderTime||'20:30'),pastRemind=new Date().toTimeString().slice(0,5)>=time;
 const reminder=!c&&pastRemind?`<div class="card warm slim"><div class="row between"><div class="grow"><b>Time for your daily reset</b><div class="muted small">Two minutes to convert experience into learning.</div></div><button class="btn sm secondary" data-go="checkin">Reflect</button></div></div>`:'';
 return `${filterBar()}<div class="hero"><div class="eyebrow">${safe(new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}))} · Your daily practice</div><h1>Lead. Learn.<br>Lead better.</h1><p class="lead">Build the habit of noticing what works, learning from what doesn’t, and trying something different next time.</p></div>${reminder}

 else if(form.id==='goal-form'){const name=val(form,'name'),desc=val(form,'desc');if(!name)return;state.goals.push({id:uid(),name,desc:desc||'Practise this behaviour intentionally.',tag:'Custom focus',role:val(form,'role'),active:state.goals.filter(g=>g.active).length<3,custom:true});if(save()){render();notify('Behaviour added')}}
 else if(form.id==='complete-form'){const e=state.entries.find(x=>x.id===showingReviewEntry);if(!e)return;e.result=val(form,'result');e.status='tried';e.completedAt=localDay();if(save()){go('review');notify('Experiment reviewed — learning captured')}}
 else if(form.id==='weekly-form'){const role=val(form,'role'),wk=weekStart();let w=state.weekly.find(x=>x.week===wk&&x.role===role);if(!w){w={id:uid(),week:wk,role};state.weekly.push(w)}Object.assign(w,{pattern:val(form,'pattern'),evidence:val(form,'evidence'),experiment:val(form,'experiment'),transfer:val(form,'transfer')});if(save()){go('review');notify('Weekly review saved')}}
 else if(form.id==='reminder-form'){state.reminderTime=val(form,'reminder')||'20:30';if(save())notify('Time saved. Set a recurring iPhone Reminder for background alerts.')}
}
function downloadFile(filename,content,type){const blob=new Blob([content],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)}
function icsDownload(){const time=String(state.reminderTime||'20:30').replace(':','');const day=localDay().replace(/-/g,'');const timestamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Leadwell//Leadership Practice//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:leadwell-daily-'+uid()+'@leadwell.local','DTSTAMP:'+timestamp,'DTSTART:'+day+'T'+time+'00','DURATION:PT3M','RRULE:FREQ=DAILY','SUMMARY:Leadwell - 3-minute leadership reflection','DESCRIPTION:Notice a win. Learn from one challenge. Choose a next-time behaviour.','BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:Time for your leadership reset','END:VALARM','END:VEVENT','END:VCALENDAR'];downloadFile('leadwell-daily-reflection.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8')}
function importFile(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(String(r.result));if(!d||!Array.isArray(d.entries)||!Array.isArray(d.checkins)||!Array.isArray(d.goals)||!Array.isArray(d.weekly)||!d.practices||typeof d.practices!=='object')throw Error('Invalid backup structure');if(!confirm(`Replace this journal with the backup? It contains ${d.entries.length} field notes and ${d.checkins.length} daily reflections. Current data will be overwritten.`))return;state={...baseData(),...d};if(save()){go('today');notify('Journal restored from backup')}}catch(err){notify('That file is not a valid Leadwell backup.')}};r.onerror=()=>notify('Could not read that file.');r.readAsText(file)}
document.addEventListener('submit',event=>{if(event.target.matches('form')){event.preventDefault();bindSubmit(event.target)}});
document.addEventListener('change',event=>{const t=event.target;if(t.dataset.practice){const date=localDay();if(!state.practices[date])state.practices[date]={};state.practices[date][t.dataset.practice]=t.checked;if(save()){render();notify(t.checked?'Practice recorded':'Practice unchecked')}}else if(t.dataset.toggleGoal){const g=state.goals.find(x=>x.id===t.dataset.toggleGoal);if(!g)return;if(t.checked&&state.goals.filter(x=>x.active).length>=3){t.checked=false;notify('Focus on no more than three behaviours at a time.');return}g.active=t.checked;if(save())render()}else if(t.id==='import-input'){importFile(t.files[0]);t.value=''}});
document.addEventListener('click',event=>{const t=event.target.closest('button');if(!t)return;if(t.dataset.nav){go(t.dataset.nav);return}if(t.dataset.context){state.context=t.dataset.context;save();render();return}if(t.dataset.go){go(t.dataset.go,t.dataset.checkin||null);return}if(t.dataset.entry){go('detail',t.dataset.entry);return}if(t.dataset.editEntry){go('log',t.dataset.editEntry);return}if(t.dataset.editCheckin){go('checkin',t.dataset.editCheckin);return}if(t.dataset.complete){go('complete',t.dataset.complete);showingReviewEntry=t.dataset.complete;render();return}if(t.dataset.deleteEntry){if(confirm('Permanently delete this field note and its experiment result?')){state.entries=state.entries.filter(e=>e.id!==t.dataset.deleteEntry);if(save()){go('review');notify('Field note deleted')}}return}if(t.dataset.deleteGoal){if(confirm('Remove this custom focus behaviour? Your practice history for it will remain in backups but not display.')){state.goals=state.goals.filter(g=>g.id!==t.dataset.deleteGoal);if(save())render()}return}if(t.hasAttribute('data-export')){downloadFile('leadwell-backup-'+localDay()+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');notify('Backup prepared — save it somewhere safe.');return}if(t.hasAttribute('data-import')){$('import-input').click();return}if(t.hasAttribute('data-download-calendar')){icsDownload();notify('Calendar file prepared. You can also use iPhone Reminders.');return}if(t.hasAttribute('data-reset')){if(confirm('Erase ALL of your local Leadwell data on this device? This cannot be undone.')){if(confirm('Final confirmation: permanently erase the journal?')){state=baseData();if(save()){go('today');notify('Local journal cleared')}}}return}});
window.addEventListener('pageshow',()=>{if(view==='today'||view==='focus'||view==='review')render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
